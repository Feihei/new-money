[workspace]
resolver = "2"
members = ["crates/game_core", "crates/game_app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# 精确锁定：Bevy 0.20 小版本升级是破坏性的，禁止 cargo update
bevy = { version = "=0.20.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
rand_chacha = "0.9"

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 3
