# 并行 job 上限。这台机器 12 核 / 32 GB，而本项目是 bevy：一次 `cargo test -p game_core`
# 要编 1 个库 + **链 10 条集成测试二进制**，实测每个 rustc/link 任务峰值约 1.5 GB 私有内存
# （这已经是把依赖的调试信息关掉之后的数，见根目录 `Cargo.toml` 的 `[profile.dev]`）。
# 放满 12 路 ≈ 18 GB 提交内存，加上 IDE 与浏览器就是整机死机的那个数。
#
# 6 路把峰值压到 ~9 GB，代价是那次 25 s 的重建变成约 40 s —— 只有依赖变了才付一次全价，
# 日常增量重建的差别看不出来。觉得太保守就改这个数，别改 profile。
[build]
jobs = 6
